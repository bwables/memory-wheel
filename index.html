<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Memory Wheel</title>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
  touch-action: manipulation;
}

body {
  background: #f4f1ea;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: Georgia, serif;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}

#wheel {
  position: relative;
  width: min(94vw, 72vh);
  height: min(94vw, 72vh);
  touch-action: none;
}

/* wheel images */
.layer {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  transform-origin: center center;
  user-select: none;
  -webkit-user-select: none;
  pointer-events: none;
  transition: transform 0.45s ease;
}

/* stacking */
#outer { z-index: 1; }
#middle { z-index: 2; }
#inner { z-index: 3; }
#center { z-index: 4; }

#paper {
  z-index: 5;
  mix-blend-mode: multiply;
  opacity: 1;
  object-fit: cover;
}

#controls {
  margin-top: 18px;
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
  z-index: 20;
}

button {
  font-family: "Old English Text MT", "UnifrakturMaguntia", Georgia, serif;
  font-size: 24px;
  padding: 14px 22px;
  min-width: 105px;
  border: 2px solid #2a2118;
  background: #efe5cf;
  color: #2a2118;
  border-radius: 8px;
  cursor: pointer;
  touch-action: manipulation;
  box-shadow: 0 2px 0 #2a2118;
}

button:active {
  transform: scale(0.96);
  box-shadow: 0 1px 0 #2a2118;
}
</style>
</head>

<body>

<div id="wheel">
  <img src="outerf.png" id="outer" class="layer">
  <img src="middlef.png" id="middle" class="layer">
  <img src="innerf.png" id="inner" class="layer">
  <img src="centerf.png" id="center" class="layer">
  <img src="paper2.jpg" id="paper" class="layer">
</div>

<div id="controls">
  <button onclick="rotateRing('outer')">Outer</button>
  <button onclick="rotateRing('middle')">Middle</button>
  <button onclick="rotateRing('inner')">Inner</button>
</div>

<script>
const rotations = {
  outer: 0,
  middle: 0,
  inner: 0
};

// For 5 slices, use 72 degrees.
// Change to 60 if you return to 6 slices.
const rotationStep = 72;

function rotateRing(id) {
  rotations[id] += rotationStep;
  document.getElementById(id).style.transform =
    `rotate(${rotations[id]}deg)`;
}

// Prevent double-tap zoom on mobile.
let lastTouchEnd = 0;
document.addEventListener('touchend', function(event) {
  const now = Date.now();
  if (now - lastTouchEnd <= 300) {
    event.preventDefault();
  }
  lastTouchEnd = now;
}, false);
</script>

</body>
</html>
