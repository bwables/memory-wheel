<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Wheel</title>

<style>
body {
  margin: 0;
  min-height: 100vh;
  background: #f4f1ea;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: Georgia, serif;
}

#controls {
  margin-bottom: 14px;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: center;
}

button {
  font-size: 16px;
  padding: 8px 14px;
  border: 1px solid #333;
  background: #efe5cf;
  cursor: pointer;
  border-radius: 4px;
}

button:active {
  transform: scale(0.97);
}

#wheel {
  position: relative;
  width: 90vw;
  aspect-ratio: 16 / 9;
  max-height: 80vh;
}

/* wheel layers */
.ring {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: contain;
  left: 0;
  top: 0;
  transform-origin: center;
  user-select: none;
  pointer-events: none;
  transition: transform 0.45s ease;
}

/* paper texture overlay */
.texture {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: cover;
  left: 0;
  top: 0;

  mix-blend-mode: multiply;
  opacity: 1;

  pointer-events: none;
}

/* stacking order */
#outer { z-index: 1; }
#middle { z-index: 2; }
#inner { z-index: 3; }
#paper { z-index: 4; }

</style>
</head>

<body>

<div id="controls">
  <button onclick="rotateRing('outer')">Outer</button>
  <button onclick="rotateRing('middle')">Middle</button>
  <button onclick="rotateRing('inner')">Inner</button>
</div>

<div id="wheel">
  <img src="outer3.png" id="outer" class="ring">
  <img src="middle3.png" id="middle" class="ring">
  <img src="inner3.png" id="inner" class="ring">

  <!-- paper overlay -->
  <img src="paper2.jpg" id="paper" class="texture">
</div>

<script>
const rotations = {
  outer: 0,
  middle: 0,
  inner: 0
};

function rotateRing(id) {
  rotations[id] += 72;
  document.getElementById(id).style.transform =
    `rotate(${rotations[id]}deg)`;
}
</script>

</body>
</html>
