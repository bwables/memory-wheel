<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Volvelle</title>

<style>
body {
  margin: 0;
  min-height: 100vh;
  background: #f4f1ea;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: Georgia, serif;
  overflow: hidden;
}

#controls {
  margin-bottom: 10px;
  display: flex;
  gap: 8px;
  justify-content: center;
  flex-wrap: wrap;
  z-index: 20;
}

button {
  font-size: 16px;
  padding: 9px 14px;
  border: 1px solid #2a2118;
  background: #efe5cf;
  color: #2a2118;
  border-radius: 6px;
  cursor: pointer;
}

button:active {
  transform: scale(0.96);
}

#wheel {
  position: relative;
  width: min(94vw, 82vh);
  height: min(94vw, 82vh);
  touch-action: manipulation;
}

/* wheel images */
.layer {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  transform-origin: center center;
  user-select: none;
  -webkit-user-select: none;
  pointer-events: none;
  transition: transform 0.45s ease;
}

/* stacking */
#outer { z-index: 1; }
#middle { z-index: 2; }
#inner { z-index: 3; }
#center { z-index: 4; }
#paper {
  z-index: 5;
  mix-blend-mode: multiply;
  opacity: 1;
}
</style>
</head>

<body>

<div id="controls">
  <button onclick="rotateRing('outer')">Outer</button>
  <button onclick="rotateRing('middle')">Middle</button>
  <button onclick="rotateRing('inner')">Inner</button>
</div>

<div id="wheel">
  <img src="outerf.png" id="outer" class="layer">
  <img src="middlef.png" id="middle" class="layer">
  <img src="innerf.png" id="inner" class="layer">
  <img src="centerf.png" id="center" class="layer">
  <img src="paperf.png" id="paper" class="layer">
</div>

<script>
const rotations = {
  outer: 0,
  middle: 0,
  inner: 0
};

// For 5 slices, use 72 degrees.
// Change to 60 if you return to 6 slices.
const rotationStep = 72;

function rotateRing(id) {
  rotations[id] += rotationStep;
  document.getElementById(id).style.transform =
    `rotate(${rotations[id]}deg)`;
}
</script>

</body>
</html>
